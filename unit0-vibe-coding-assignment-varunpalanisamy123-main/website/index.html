<div class="joke-card">
<h2>Minecraft Joke</h2>
 
<p id="joke">
Click the button for a joke!
</p>
 
<button class="toc-btn" onclick="showJoke()">
Tell Me A Joke
</button>
</div>

<script>
function showJoke() {
 
const jokes = [
"Why didn't Steve get lost? Because he always follows the block map!",
"Why are Endermen bad at hiding? They're always sticking out!",
"What is a Creeper's favorite type of music? Boom-box music!",
"Why did the chicken cross the Nether? To get to the End!",
"Why was the Diamond Pickaxe happy? It finally found its purpose!"
];
 
let randomJoke = Math.floor(Math.random() * jokes.length);
 
document.getElementById("joke").innerText = jokes[randomJoke];
}
</script>
